<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia — Gestion d'école</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#172554">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Academia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#172554; --navy-900:#1e3a8a; --navy-700:#1d4ed8;
    --amber-500:#f59e0b; --amber-600:#d97706;
    --emerald-600:#059669; --emerald-100:#d1fae5; --emerald-700:#047857;
    --red-600:#dc2626; --red-100:#fee2e2; --red-700:#b91c1c;
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
    --gold:#c9971c;
    --font-head:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:
      radial-gradient(circle at 8% 0%, rgba(29,78,216,.07) 0%, transparent 45%),
      radial-gradient(circle at 100% 8%, rgba(245,158,11,.08) 0%, transparent 40%),
      linear-gradient(180deg,#eef2fb 0%,var(--slate-50) 320px);
    background-attachment:fixed;color:var(--slate-800);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;transition:all .15s ease;}
  input,select,textarea{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--slate-200);box-shadow:0 1px 0 0 rgba(23,37,84,.03);}
  .topbar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy-900),var(--navy-700) 35%,var(--amber-500) 100%);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0;flex-wrap:wrap;gap:14px;}
  .topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
  .topbar-school{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:99px;}
  .topbar-school-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--navy-900);flex-shrink:0;background:#fff;}
  .topbar-school-text{line-height:1.25;}
  .topbar-school-name{font-weight:700;font-size:12.5px;color:var(--navy-950);}
  .topbar-school-meta{font-size:10.5px;color:var(--slate-500);}
  @media (max-width:640px){ .topbar-school-meta{display:none;} }
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--navy-950),var(--navy-700));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;box-shadow:0 3px 10px rgba(23,37,84,.25);}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  .logo-text{line-height:1;}
  .logo-title{font-family:var(--font-head);font-weight:800;color:var(--navy-950);font-size:20px;letter-spacing:-0.02em;}
  .logo-sub{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--amber-600);font-weight:700;}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--slate-400),var(--slate-600));border:none;border-radius:9px;color:#fff;box-shadow:0 3px 0 var(--slate-700),0 5px 10px rgba(23,37,84,.18);position:relative;top:0;}
  .icon-btn svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}
  .icon-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .icon-btn:active{top:2px;transform:translateY(0);box-shadow:0 1px 0 var(--slate-700),0 2px 5px rgba(23,37,84,.15);filter:none;}
  .icon-btn.view{background:linear-gradient(180deg,#60a5fa,var(--navy-700));box-shadow:0 3px 0 #1e3a8a,0 5px 10px rgba(29,78,216,.3);}
  .icon-btn.view:active{box-shadow:0 1px 0 #1e3a8a,0 2px 5px rgba(29,78,216,.3);}
  .icon-btn.edit{background:linear-gradient(180deg,#fbbf24,var(--amber-600));box-shadow:0 3px 0 #92400e,0 5px 10px rgba(217,119,6,.3);}
  .icon-btn.edit:active{box-shadow:0 1px 0 #92400e,0 2px 5px rgba(217,119,6,.3);}
  .icon-btn.danger{background:linear-gradient(180deg,#f87171,var(--red-600));box-shadow:0 3px 0 #7f1d1d,0 5px 10px rgba(220,38,38,.3);}
  .icon-btn.danger:active{box-shadow:0 1px 0 #7f1d1d,0 2px 5px rgba(220,38,38,.3);}
  .icon-btn.neutral{background:linear-gradient(180deg,#94a3b8,var(--slate-600));box-shadow:0 3px 0 var(--slate-700),0 5px 10px rgba(23,37,84,.18);}
  .logout-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px 9px 12px;border-radius:99px;background:linear-gradient(180deg,#fff,#fef2f2);color:var(--red-700);font-weight:800;font-size:12.5px;border:1.5px solid #fecaca;box-shadow:0 3px 0 #fca5a5,0 5px 12px rgba(220,38,38,.15);position:relative;top:0;letter-spacing:.01em;}
  .logout-btn:hover{background:linear-gradient(180deg,#fff,#fee2e2);border-color:var(--red-600);transform:translateY(-1px);}
  .logout-btn:active{top:2px;transform:translateY(0);box-shadow:0 1px 0 #fca5a5,0 2px 5px rgba(220,38,38,.15);}
  .tabs{display:flex;gap:5px;overflow-x:auto;padding:6px;margin-top:16px;background:#fff;border:1px solid var(--slate-200);border-radius:16px;box-shadow:0 3px 12px rgba(23,37,84,.05);}
  .tab{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:700;white-space:nowrap;background:transparent;color:var(--slate-500);border:none;transition:color .18s ease,background .18s ease;}
  .tab-ic{font-size:14px;}
  .tab:hover{color:var(--navy-700);background:var(--slate-100);}
  .tab.active{color:#fff;background:linear-gradient(135deg,#3b63e0,var(--navy-950));box-shadow:0 3px 10px rgba(23,37,84,.35);}
  .tab.active:hover{color:#fff;background:linear-gradient(135deg,#3b63e0,var(--navy-950));}

  /* --- Menu latéral (Espace Administrateur & Espace Secrétaire) --- */
  .hamburger-btn{border:none;background:var(--slate-100);color:var(--navy-950);width:46px;height:46px;border-radius:12px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s ease;margin-top:4px;}
  .hamburger-btn:hover{background:var(--slate-200);}
  .sec-drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .sec-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .sec-drawer{position:fixed;top:0;left:0;height:100vh;width:290px;max-width:85vw;background:#fff;z-index:61;box-shadow:10px 0 30px rgba(23,37,84,.25);transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;}
  .sec-drawer.open{transform:translateX(0);}
  .sec-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--slate-200);font-weight:800;color:var(--navy-950);font-size:14.5px;flex-shrink:0;}
  .drawer-close-btn{border:none;background:var(--slate-100);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--slate-600);}
  .drawer-close-btn:hover{background:var(--slate-200);}
  .sec-drawer-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
  .drawer-tab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;font-size:14px;font-weight:700;text-align:left;background:transparent;color:var(--slate-600);border:none;cursor:pointer;transition:color .18s ease,background .18s ease;}
  .drawer-tab:hover{background:var(--slate-100);}
  .drawer-tab.active{color:#fff;background:linear-gradient(135deg,#3b63e0,var(--navy-950));box-shadow:0 3px 10px rgba(23,37,84,.3);}
  @media print{ .sec-drawer, .sec-drawer-backdrop, .hamburger-btn{display:none !important;} }
  .card{background:#fff;border:1px solid var(--slate-200);border-radius:18px;box-shadow:0 2px 10px rgba(23,37,84,.05);transition:box-shadow .25s ease,transform .25s ease;}
  .card:hover{box-shadow:0 10px 26px rgba(23,37,84,.10);}
  .p5{padding:20px;}
  .p8{padding:28px;}
  .grid-gap{display:grid;gap:20px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .wrap-gap{flex-wrap:wrap;gap:12px;}
  h3.title{margin:0 0 16px 0;color:var(--navy-950);font-family:var(--font-head);font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px;padding-left:11px;border-left:4px solid;border-image:linear-gradient(180deg,var(--navy-700),var(--amber-500)) 1;}
  .field{display:flex;flex-direction:column;gap:5px;font-size:13px;}
  .field span{color:var(--slate-500);font-weight:600;}
  .field input, .field select, .field textarea{border:1.5px solid var(--slate-300);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(29,78,216,.15);}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:13.5px;color:#fff;position:relative;top:0;letter-spacing:.01em;}
  .btn:active{top:2px;}
  .btn-navy{background:linear-gradient(180deg,#3b63e0,var(--navy-900));box-shadow:0 4px 0 #101c46,0 7px 16px rgba(23,37,84,.4);}
  .btn-navy:hover{background:linear-gradient(180deg,#4569e6,var(--navy-900));box-shadow:0 5px 0 #101c46,0 9px 20px rgba(23,37,84,.45);}
  .btn-navy:active{box-shadow:0 1px 0 #101c46,0 2px 6px rgba(23,37,84,.3);}
  .btn-green{background:linear-gradient(180deg,#22c98e,var(--emerald-700));box-shadow:0 4px 0 #064e3b,0 7px 16px rgba(5,150,105,.4);}
  .btn-green:hover{background:linear-gradient(180deg,#2fdb9e,var(--emerald-700));box-shadow:0 5px 0 #064e3b,0 9px 20px rgba(5,150,105,.45);}
  .btn-green:active{box-shadow:0 1px 0 #064e3b,0 2px 6px rgba(5,150,105,.3);}
  .btn-red{background:linear-gradient(180deg,#f15a5a,var(--red-700));box-shadow:0 4px 0 #7f1d1d,0 7px 16px rgba(220,38,38,.4);}
  .btn-red:hover{background:linear-gradient(180deg,#f56b6b,var(--red-700));box-shadow:0 5px 0 #7f1d1d,0 9px 20px rgba(220,38,38,.45);}
  .btn-red:active{box-shadow:0 1px 0 #7f1d1d,0 2px 6px rgba(220,38,38,.3);}
  .btn-amber{background:linear-gradient(180deg,#ffcc4d,var(--amber-600));color:#4a2c02;box-shadow:0 4px 0 #92400e,0 7px 16px rgba(217,119,6,.4);}
  .btn-amber:hover{background:linear-gradient(180deg,#ffd668,var(--amber-600));box-shadow:0 5px 0 #92400e,0 9px 20px rgba(217,119,6,.45);}
  .btn-amber:active{box-shadow:0 1px 0 #92400e,0 2px 6px rgba(217,119,6,.3);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--slate-500);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;border-bottom:1.5px solid var(--slate-200);padding:8px 10px 8px 0;}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--slate-100);}
  tbody tr:hover{background:rgba(29,78,216,.035);}
  .empty-row{text-align:center;color:var(--slate-400);padding:26px 0;}
  .stat{border-radius:18px;padding:18px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;overflow:hidden;}
  .stat::after{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.10);}
  .stat.blue{background:linear-gradient(135deg,var(--navy-900),var(--navy-950));} .stat.emerald{background:linear-gradient(135deg,var(--emerald-600),var(--emerald-700));}
  .stat.red{background:linear-gradient(135deg,var(--red-600),var(--red-700));} .stat.amber{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));}
  .stat.white{background:#fff;color:var(--navy-950);border:1px solid var(--slate-200);box-shadow:0 2px 8px rgba(23,37,84,.05);}
  .stat.white::after{background:rgba(29,78,216,.05);}
  .stat-top{display:flex;align-items:center;justify-content:space-between;opacity:.95;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px;position:relative;z-index:1;}
  .stat-ic-badge{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .stat.white .stat-ic-badge{background:var(--slate-100);}
  .stat-val{font-family:var(--font-head);font-size:22px;font-weight:800;position:relative;z-index:1;}
  .role-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;background:
      radial-gradient(circle at 15% 15%, rgba(29,78,216,.10) 0%, transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(245,158,11,.12) 0%, transparent 38%),
      radial-gradient(circle at 50% 0%,#e9eefb 0%,var(--slate-50) 55%);}
  .role-p{color:var(--slate-500);margin:18px 0 34px;text-align:center;max-width:360px;font-size:14.5px;}
  .role-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--slate-200);border-radius:20px;padding:20px;text-align:left;width:100%;max-width:380px;margin-bottom:14px;box-shadow:0 3px 14px rgba(23,37,84,.06);transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s ease,border-color .25s ease;}
  .role-card:hover{border-color:var(--navy-700);transform:translateY(-3px) scale(1.01);box-shadow:0 10px 26px rgba(23,37,84,.14);}
  .role-ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .role-title{font-family:var(--font-head);font-weight:700;color:var(--navy-950);font-size:15.5px;}
  .role-desc{font-size:13px;color:var(--slate-500);margin-top:2px;}
  .pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
  .pill.in{background:var(--emerald-100);color:var(--emerald-700);}
  .pill.out{background:var(--red-100);color:var(--red-700);}
  .toast{position:fixed;top:16px;right:16px;z-index:60;background:linear-gradient(135deg,var(--emerald-600),var(--emerald-700));color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toast-in .2s ease;}
  .toast.error{background:linear-gradient(135deg,var(--red-600),var(--red-700));}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);}
  .modal-box{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 14px 50px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--slate-200);background:linear-gradient(135deg,#f8fafc,#eef2fb);border-radius:18px 18px 0 0;}
  .modal-head h3{margin:0;color:var(--navy-950);font-family:var(--font-head);font-weight:700;font-size:15px;}
  .modal-body{padding:20px;}
  .notice{display:flex;align-items:center;gap:8px;font-size:13px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;}
  .link-btn{background:#fff;color:var(--navy-900);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1.5px solid var(--slate-200);border-radius:12px;box-shadow:0 2px 8px rgba(23,37,84,.06);}
  .link-btn:hover{text-decoration:none;color:var(--navy-950);background:var(--slate-50);border-color:var(--navy-700);transform:translateY(-1px);}
  .muted{color:var(--slate-400);font-size:12px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:90px;font-size:12.5px;font-weight:600;color:var(--slate-600);flex-shrink:0;}
  .bar-track{flex:1;background:var(--slate-100);border-radius:8px;height:20px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--navy-900);border-radius:8px;}
  .bar-val{width:110px;text-align:right;font-size:12.5px;font-weight:700;color:var(--slate-700);flex-shrink:0;}
  .evo-chart{display:flex;align-items:flex-end;gap:14px;overflow-x:auto;padding:10px 4px;min-height:220px;}
  .evo-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:60px;}
  .evo-bars{display:flex;align-items:flex-end;gap:3px;height:160px;}
  .evo-bar{width:14px;border-radius:4px 4px 0 0;}
  .evo-label{font-size:10.5px;color:var(--slate-500);margin-top:4px;white-space:nowrap;}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--slate-600);margin-bottom:6px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .report-tile{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--slate-200);border-radius:18px;padding:18px;text-align:left;box-shadow:0 2px 8px rgba(23,37,84,.04);}
  .report-tile.active{border-color:var(--navy-700);background:linear-gradient(180deg,#eef2fb,#fff);box-shadow:0 4px 14px rgba(23,37,84,.15);}
  .report-tile.active .report-ic{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));}
  .report-tile:hover{border-color:var(--navy-900);transform:translateY(-2px);box-shadow:0 8px 20px rgba(23,37,84,.1);}
  .report-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy-900),var(--navy-950));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 3px 8px rgba(23,37,84,.2);}
  .print-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--navy-950);padding-bottom:16px;margin-bottom:22px;}
  .ph-right{text-align:right;}
  .ph-title{font-weight:800;color:var(--navy-950);}
  .ph-sub{font-size:13px;color:var(--slate-500);}
  .amount-box{background:#eff6ff;border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:space-between;margin:18px 0;}
  .amount-lbl{color:var(--navy-900);font-weight:600;}
  .amount-val{font-size:26px;font-weight:800;color:var(--navy-950);}
  .sign-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px;font-size:13px;}
  .sign-line{border-top:1px solid var(--slate-300);padding-top:8px;color:var(--slate-400);}
  .logo-upload-preview{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--slate-200);box-shadow:0 2px 8px rgba(23,37,84,.08);}
  h2,h4{font-family:var(--font-head);}
  .ph-title{font-family:var(--font-head);}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}

  /* --- Quittance --- */
  .receipt{border:2px solid var(--gold);border-radius:10px;padding:18px 22px;position:relative;background:#fffdf7;}
  .receipt + .receipt{margin-top:10px;}
  .receipt-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .receipt-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--navy-900);flex-shrink:0;}
  .receipt-logo-fallback{width:64px;height:64px;border-radius:50%;border:2px solid var(--navy-900);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;background:#f1f5f9;}
  .receipt-school{flex:1;}
  .receipt-school b{color:var(--navy-900);font-size:15px;display:block;}
  .receipt-school .tel{font-size:11.5px;color:var(--slate-600);}
  .receipt-num-badge{background:#3b2410;color:#fff;padding:6px 10px;border-radius:6px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:8px;}
  .receipt-num-badge b{background:#fff;color:var(--red-600);padding:2px 10px;border-radius:4px;font-family:monospace;font-size:14px;}
  .receipt-date{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .receipt-line{margin:9px 0;font-size:13.5px;}
  .receipt-line .lbl{font-weight:700;}
  .receipt-line .fill{border-bottom:1px dotted var(--slate-400);display:inline-block;min-width:160px;padding:0 4px;}
  .receipt-cats{margin:10px 0;}
  .receipt-cat{font-size:13px;margin:4px 0;}
  .receipt-cat .box{display:inline-block;width:13px;height:13px;border:1px solid var(--slate-600);text-align:center;line-height:12px;font-size:11px;margin-right:6px;}
  .receipt-bottom{display:flex;justify-content:space-between;align-items:flex-start;margin-top:12px;gap:16px;flex-wrap:wrap;}
  .receipt-remain{border:1px solid var(--slate-600);border-radius:4px;padding:6px 14px;font-weight:700;display:inline-block;min-width:100px;}
  .receipt-words{flex:1;min-width:220px;font-size:12px;}
  .receipt-words .line{border-bottom:1px dotted var(--slate-400);min-height:16px;margin-top:2px;}
  .cut-line{display:flex;align-items:center;gap:8px;color:var(--slate-400);font-size:11px;margin:6px 0;}
  .cut-line hr{flex:1;border:none;border-top:1px dashed var(--slate-400);}

  /* --- Bulletin --- */
  .bul-head{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid var(--navy-950);padding-bottom:14px;margin-bottom:14px;}
  .bul-left{display:flex;gap:10px;align-items:flex-start;width:190px;flex-shrink:0;}
  .bul-left img, .bul-logo-fallback{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--navy-900);flex-shrink:0;}
  .bul-logo-fallback{display:flex;align-items:center;justify-content:center;font-size:22px;background:#f1f5f9;}
  .bul-left .name{font-weight:800;color:var(--navy-950);font-size:13px;line-height:1.25;}
  .bul-left .contact{font-size:10.5px;color:var(--slate-500);margin-top:3px;}
  .bul-center{flex:1;text-align:center;font-size:11px;line-height:1.5;}
  .bul-center .country{font-weight:800;font-size:13px;}
  .bul-right{width:190px;flex-shrink:0;font-size:11px;text-align:right;}
  .bul-flag{display:flex;height:16px;width:44px;margin-left:auto;margin-bottom:6px;border:1px solid var(--slate-300);}
  .bul-flag div{flex:1;}
  .bul-flag-img{display:block;width:46px;height:auto;margin-left:auto;margin-bottom:14px;border:1px solid var(--slate-300);border-radius:2px;box-shadow:0 1px 3px rgba(23,37,84,.15);}
  .bul-right-info{text-align:right;}
  .bul-title-box{border:2px solid var(--navy-950);border-radius:8px;text-align:center;padding:8px;font-weight:800;font-size:18px;color:#fff;margin-bottom:14px;letter-spacing:.03em;background:linear-gradient(135deg,var(--navy-900),var(--navy-950));box-shadow:0 2px 8px rgba(23,37,84,.2);}
  .bul-info{border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;background:linear-gradient(180deg,#eff6ff,#fff);}
  .bul-info-row{display:flex;justify-content:space-between;gap:20px;padding:3px 0;}
  .bul-section-title{background:linear-gradient(135deg,var(--navy-900),var(--navy-950));color:#fff;text-align:center;font-weight:800;font-size:12px;padding:6px;border:1px solid var(--navy-950);letter-spacing:.05em;border-radius:4px 4px 0 0;}
  .bul-table th, .bul-table td{border:1px solid var(--slate-300);font-size:11.5px;padding:5px 6px;}
  .bul-table th{background:var(--slate-100);color:var(--navy-950);text-align:center;}
  .bul-recap td{border:1px solid var(--slate-300);font-size:12px;padding:6px 10px;background:#fffdf7;}
  .bul-box{border:1px solid var(--slate-300);border-left:4px solid var(--emerald-600);border-radius:6px;padding:10px;font-size:11.5px;min-height:70px;background:#fff;}
  .bul-box:last-child{border-left-color:var(--amber-500);}
  .bul-box-title{font-weight:800;text-align:center;font-size:11.5px;margin-bottom:6px;color:var(--navy-950);}

  /* --- Filigrane & format A4 (quittance / bulletin) --- */
  .wm-bg{position:absolute;inset:0;z-index:-1;background-repeat:no-repeat;background-position:center;background-size:46% auto;opacity:.08;pointer-events:none;}
  .wm-bg-tile{position:absolute;inset:-70px;z-index:-1;background-repeat:repeat;background-position:0 0;background-size:120px auto;opacity:.055;pointer-events:none;transform:rotate(-18deg);}
  .receipt{position:relative;z-index:0;}
  .bulletin-sheet{position:relative;z-index:0;overflow:hidden;}
  .report-head-logo{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--slate-200);flex-shrink:0;}
  .report-head-logo-fallback{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--slate-100);border:1px solid var(--slate-200);flex-shrink:0;}
  .ph-school-name{font-weight:800;color:var(--navy-950);font-family:var(--font-head);font-size:15px;}
  .ph-school-meta{font-size:11.5px;color:var(--slate-500);margin-top:2px;}

  @media print {
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    .no-print{display:none !important;}
    body{background:#fff;}
    .print-area{box-shadow:none !important;border:none !important;}
    @page{ size:A4; margin:8mm; }
    .receipt-page, .bulletin-sheet{width:190mm;margin:0 auto;}
    .receipt{padding:14px 18px;page-break-inside:avoid;}
    .receipt-head{margin-bottom:10px;}
    .wm-bg{opacity:.09 !important;}
    .wm-bg-tile{opacity:.06 !important;}
    .bulletin-sheet{page-break-inside:avoid;transform-origin:top center;}
    .card.p8.bulletin-sheet{padding:10px 16px;}
    .bul-head{margin-bottom:8px;padding-bottom:8px;}
    .bul-left,.bul-right{width:170px;}
    .bul-left img,.bul-logo-fallback{width:44px;height:44px;}
    .bul-title-box{padding:5px;font-size:14px;margin-bottom:8px;}
    .bul-info{padding:7px 12px;margin-bottom:8px;font-size:11px;}
    .bul-info-row{padding:1.5px 0;}
    .bul-section-title{padding:3px;font-size:10.5px;}
    .bul-table{margin-bottom:8px !important;}
    .bul-table th, .bul-table td{padding:2.5px 5px;font-size:10px;}
    .bul-recap td{padding:3px 8px;font-size:10.5px;}
    .bul-box{padding:6px;min-height:42px;font-size:10px;}
    .bul-box-title{font-size:10px;margin-bottom:3px;}
    .bulletin-sheet .sign-row{margin-top:10px;font-size:10.5px;}
  }
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%, rgba(29,78,216,.10) 0%, transparent 50%),linear-gradient(180deg,#eef2fb 0%,var(--slate-50) 100%);transition:opacity .5s ease;}
  #splash.hide{opacity:0;pointer-events:none;}
  #splash-logo{width:96px;height:96px;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(23,37,84,.25);animation:splash-pop .5s ease;}
  #splash-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  #splash-title{font-family:var(--font-head);font-weight:800;font-size:24px;color:var(--navy-950);letter-spacing:-0.02em;}
  #splash-by{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate-500);position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:9999;transition:opacity .5s ease;}
  #splash-by.hide{opacity:0;pointer-events:none;}
  #splash-by b{color:var(--amber-600);}
  @keyframes splash-pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
</style>
</head>

  <div id="splash-logo"><img id="splash-logo-img" alt="Academia"></div>
  <div id="splash-title">Academia</div>

/* =========================================================
   LICENCE — VÉRIFICATION AUPRÈS DU SERVEUR CENTRAL KINVOS
   =========================================================
   Un code appareil est généré sur ce poste et envoyé, avec la clé de
   licence saisie, au serveur central KINVOS pour vérification en
   temps réel (POST /api/verify). Un cache local permet un usage
   hors-ligne temporaire (LICENCE_DELAI_GRACE_JOURS jours).
*/
const LICENSE_DEVICE_KEY = "academia-device-id-v1";
const LICENSE_STATE_KEY = "academia-license-v2";
const KINVOS_SERVEUR_URL = "https://licencemanager.ficheprobot.workers.dev/api/verify";
const LICENCE_DELAI_GRACE_JOURS = 7;

const SHORT_CODE_ALPHABET = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; // sans 0,1,O,I,L pour éviter la confusion
function generateShortCode(len){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let out = "";
  for(let i=0;i<len;i++){ out += SHORT_CODE_ALPHABET[bytes[i] % SHORT_CODE_ALPHABET.length]; }
  return out;
}
function getOrCreateDeviceId(){
  let id = localStorage.getItem(LICENSE_DEVICE_KEY);
  if(!id){
    id = generateShortCode(8);
    localStorage.setItem(LICENSE_DEVICE_KEY, id);
  }
  return id;
}

function lireLicenceStockee(){
  try{ return JSON.parse(localStorage.getItem(LICENSE_STATE_KEY) || "null"); }
  catch(e){ return null; }
}
function ecrireLicenceStockee(etat){
  localStorage.setItem(LICENSE_STATE_KEY, JSON.stringify(etat));
}

async function verifierAupresDuServeur(cleLicence, codeAppareil){
  try{
    const reponse = await fetch(KINVOS_SERVEUR_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ license_key: cleLicence, device_fingerprint: codeAppareil })
    });
    const resultat = await reponse.json();
    return { ok:true, ...resultat };
  } catch(e){
    return { ok:false };
  }
}

const MESSAGES_ERREUR_LICENCE = {
  CLE_INCONNUE: "Cette clé de licence est introuvable.",
  LICENCE_EXPIREE: "Cette licence a expiré.",
  LICENCE_DESACTIVEE: "Cette licence a été désactivée.",
  LICENCE_DEJA_UTILISEE: "Cette licence est déjà utilisée sur le nombre maximal d'appareils autorisés.",
  PARAMETRES_MANQUANTS: "Code d'activation invalide."
};

async function checkStoredLicense(){
  const deviceId = getOrCreateDeviceId();
  const stocke = lireLicenceStockee();
  if(!stocke || !stocke.cle) return {ok:false, deviceId};

  const expirationValide = !stocke.expiration || new Date(stocke.expiration).getTime() > Date.now();
  const joursDepuisVerif = stocke.derniere_verification
    ? (Date.now() - new Date(stocke.derniere_verification).getTime()) / 86400000
    : Infinity;

  if(expirationValide && joursDepuisVerif <= LICENCE_DELAI_GRACE_JOURS){
    // Grâce hors-ligne : on laisse entrer et on revérifie en arrière-plan.
    verifierAupresDuServeur(stocke.cle, deviceId).then(resultat => {
      if(resultat.ok){
        if(resultat.valid){
          ecrireLicenceStockee({...stocke, expiration: resultat.expiration || null, derniere_verification: new Date().toISOString()});
        } else {
          ecrireLicenceStockee({...stocke, invalidee: true});
        }
      }
    });
    return {ok:true, deviceId, payload:{d:deviceId, x:stocke.expiration, nom:stocke.nom}};
  }

  const resultat = await verifierAupresDuServeur(stocke.cle, deviceId);
  if(!resultat.ok){
    return {ok:false, deviceId, reason:"Impossible de joindre le serveur de licences. Vérifiez votre connexion internet."};
  }
  if(!resultat.valid){
    return {ok:false, deviceId, reason: MESSAGES_ERREUR_LICENCE[resultat.reason] || "Clé de licence invalide."};
  }
  ecrireLicenceStockee({...stocke, expiration: resultat.expiration || null, derniere_verification: new Date().toISOString()});
  return {ok:true, deviceId, payload:{d:deviceId, x:resultat.expiration || null, nom:stocke.nom}};
}

function lockScreenHTML(deviceId, errorMsg){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#eef2fb 0%,#f8fafc 100%);">
    <div class="card p8" style="max-width:440px;width:100%;text-align:center;">
      <div style="width:64px;height:64px;border-radius:18px;overflow:hidden;margin:0 auto 16px;box-shadow:0 6px 18px rgba(23,37,84,.2);"><img src="${APP_LOGO_SRC}" style="width:100%;height:100%;object-fit:cover;"></div>
      <h3 style="font-family:var(--font-head);color:var(--navy-950);margin:0 0 6px;">Activation requise</h3>
      <p style="color:var(--slate-500);font-size:13.5px;margin:0 0 18px;">Cette installation d'Academia nécessite une clé de licence.</p>
      <div class="field" style="margin-bottom:12px;text-align:left;">
        <span>Votre nom</span>
        <input type="text" id="license-nom-input" placeholder="Nom de l'école / du responsable">
      </div>
      <div class="field" style="margin-bottom:12px;text-align:left;">
        <span>Clé de licence</span>
        <textarea id="license-input" rows="2" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"></textarea>
      </div>
      ${errorMsg? `<p style="color:var(--red-600);font-size:13px;margin:0 0 12px;font-weight:700;">${esc(errorMsg)}</p>` : ""}
      <button class="btn btn-navy" style="width:100%;justify-content:center;" data-action="activate-license">Activer</button>
      <p style="color:var(--slate-500);font-size:11.5px;margin:14px 0 0;">Clé fournie par KINVOS lors de l'achat ou du renouvellement du logiciel.</p>
    </div>

/* Montant en toutes lettres (français) */
const FR_ONES = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
function frTwoDigits(n){
  if(n<20) return FR_ONES[n];
  const tens=Math.floor(n/10), unit=n%10;
  if(tens>=2 && tens<=6){
    const tw=["","","vingt","trente","quarante","cinquante","soixante"][tens];
    if(unit===0) return tw;
    if(unit===1) return tw+"-et-un";
    return tw+"-"+FR_ONES[unit];
  }
  if(tens===7){ if(unit===1) return "soixante-et-onze"; return "soixante-"+FR_ONES[10+unit]; }
  if(tens===8){ if(unit===0) return "quatre-vingts"; return "quatre-vingt-"+FR_ONES[unit]; }
  return "quatre-vingt-"+FR_ONES[10+unit];
}
function frThreeDigits(n){
  const h=Math.floor(n/100), rest=n%100;
  let words="";
  if(h>0){ words += (h===1? "cent" : FR_ONES[h]+" cent"); if(h>1 && rest===0) words+="s"; }
  if(rest>0){ if(words) words+=" "; words+=frTwoDigits(rest); }
  return words || "zéro";
}
function numberToFrenchWords(n){
  n = Math.max(0, Math.round(Number(n)||0));
  if(n===0) return "zéro";
  let x = n, parts=[];
  const billions=Math.floor(x/1e9); x%=1e9;
  const millions=Math.floor(x/1e6); x%=1e6;
  const thousands=Math.floor(x/1e3); x%=1e3;
  const rest=x;
  if(billions>0) parts.push((billions===1?"un":frThreeDigits(billions))+" milliard"+(billions>1?"s":""));
  if(millions>0) parts.push((millions===1?"un":frThreeDigits(millions))+" million"+(millions>1?"s":""));
  if(thousands>0) parts.push(thousands===1? "mille" : frThreeDigits(thousands)+" mille");
  if(rest>0) parts.push(frThreeDigits(rest));
  return parts.join(" ");
}
function amountInWords(n){ return numberToFrenchWords(n)+" francs CFA"; }

function currentSchoolYearStart(){
  const d = new Date();
  return d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1; // l'année scolaire commence en août/septembre
}
function schoolYearOf(dateStr){
  if(!dateStr) return currentSchoolYearStart();
  const d = new Date(dateStr);
  if(isNaN(d)) return currentSchoolYearStart();
  return d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1;
}
function schoolYearLabel(y){ return `${y}-${y+1}`; }
/* Solde élève (uniquement les paiements "Frais de scolarité" de l'année scolaire active) */
function studentBalance(studentId){
  const st = db.students.find(s=>s.id===studentId);
  const due = st? (Number(st.fraisAnnuel)||0) : 0;
  const activeYear = db.meta.anneeScolaireActuelle;
  const paid = db.payments.filter(p=>p.studentId===studentId && p.categorie==="Frais de scolarité"
      && (p.anneeScolaire!==undefined? p.anneeScolaire : schoolYearOf(p.date))===activeYear)
    .reduce((a,p)=>a+p.montant,0);
  return {due, paid, remaining: due-paid};
}
/* Solde de salaire d'un enseignant pour un mois donné (YYYY-MM) */
function teacherMonthPaid(teacherId, month){
  return db.salaryPayments.filter(p=>p.teacherId===teacherId && p.mois===month).reduce((a,p)=>a+p.montant,0);
}
function teacherBalance(teacherId, month){
  const mk = month || monthKey(todayISO());
  const t = db.teachers.find(x=>x.id===teacherId);
  const salaire = t? (Number(t.salaireMensuel)||0) : 0;
  const paid = teacherMonthPaid(teacherId, mk);
  return {salaire, paid, remaining: salaire-paid};
}
function personnelFinancials(month){
  const mk = month || monthKey(todayISO());
  const masseSalariale = db.teachers.reduce((a,t)=>a+(Number(t.salaireMensuel)||0),0);
  const verseCeMois = db.salaryPayments.filter(p=>p.mois===mk).reduce((a,p)=>a+p.montant,0);
  return {masseSalariale, verseCeMois, restant: masseSalariale-verseCeMois};
}
function computeFinancials(){
  const tuitionPayments = db.payments.filter(p=>p.categorie==="Frais de scolarité").reduce((a,p)=>a+p.montant,0);
  const allPayments = db.payments.reduce((a,p)=>a+p.montant,0);
  const totalRevenuesOther = db.revenues.reduce((a,r)=>a+r.montant,0);
  const totalRevenue = allPayments+totalRevenuesOther;
  const totalExpenses = db.expenses.reduce((a,e)=>a+e.montant,0);
  const profitBeforeTax = totalRevenue-totalExpenses;
  const aib = profitBeforeTax>0? profitBeforeTax*AIB_RATE : 0;
  const netProfit = profitBeforeTax-aib;
  const totalDue = db.students.reduce((a,s)=>a+(Number(s.fraisAnnuel)||0),0);
  const recoveryRate = totalDue>0? (tuitionPayments/totalDue)*100 : 0;
  return {tuitionPayments, allPayments, totalRevenuesOther, totalRevenue, totalExpenses, profitBeforeTax, aib, netProfit, totalDue, recoveryRate};
}
function classBreakdown(){
  const map={};
  db.students.forEach(s=>{
    map[s.classe]=map[s.classe]||{classe:s.classe,du:0,paye:0,nbEleves:0,garcons:0,filles:0};
    map[s.classe].du+=Number(s.fraisAnnuel)||0; map[s.classe].nbEleves+=1;
    if(s.sexe==="F") map[s.classe].filles+=1; else map[s.classe].garcons+=1;
  });
  db.payments.forEach(p=>{
    const st=db.students.find(s=>s.id===p.studentId); if(!st) return;
    map[st.classe]=map[st.classe]||{classe:st.classe,du:0,paye:0,nbEleves:0,garcons:0,filles:0};
    map[st.classe].paye+=p.montant;
  });
  return Object.values(map).sort((a,b)=>b.paye-a.paye);
}
function effectifsParClasse(){
  const map={};
  db.students.forEach(s=>{
    map[s.classe]=map[s.classe]||{classe:s.classe,garcons:0,filles:0};
    if(s.sexe==="F") map[s.classe].filles+=1; else map[s.classe].garcons+=1;
  });
  return Object.values(map).map(c=>({...c,total:c.garcons+c.filles})).sort((a,b)=>a.classe.localeCompare(b.classe));
}
function inPeriod(dateStr, start, end){
  if(!start && !end) return true;
  if(!dateStr) return false;
  if(start && dateStr<start) return false;
  if(end && dateStr>end) return false;
  return true;
}
function periodLabel(start, end, fallback){
  if(!start && !end) return fallback;
  if(start && end) return fallback+" · Du "+formatDate(start)+" au "+formatDate(end);
  if(start) return fallback+" · À partir du "+formatDate(start);
  return fallback+" · Jusqu'au "+formatDate(end);
}
function monthlyEvolution(payments, revenues, expenses){
  const map={};
  const add=(date,key,amount)=>{ const mk=monthKey(date); map[mk]=map[mk]||{month:mk,recettes:0,depenses:0}; map[mk][key]+=amount; };
  payments.forEach(p=>add(p.date,"recettes",p.montant));
  revenues.forEach(r=>add(r.date,"recettes",r.montant));
  expenses.forEach(e=>add(e.date,"depenses",e.montant));
  return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).map(m=>({...m,label:monthLabel(m.month),benefice:m.recettes-m.depenses}));
}

/* Bulletin: calculs */
function getBulletin(studentId, periode, annee){
  return db.bulletins.find(b=>b.studentId===studentId && b.periode===periode && b.anneeScolaire===annee);
}
function bulletinMoyenne(b){
  if(!b) return null;
  const vals = b.disciplines.map(d=>parseFloat(d.obtenu)).filter(v=>!isNaN(v));
  if(vals.length===0) return null;
  return vals.reduce((a,v)=>a+v,0)/vals.length;
}
function classmateBulletins(classe, periode, annee){
  return db.bulletins.filter(b=>{
    const st = db.students.find(s=>s.id===b.studentId);
    return st && st.classe===classe && b.periode===periode && b.anneeScolaire===annee;
  }).map(b=>({b, moyenne: bulletinMoyenne(b)})).filter(x=>x.moyenne!==null);
}

function bulletinHTML(studentId){
  const student = db.students.find(s=>s.id===studentId);
  if(!student){
    return topBarHTML(role==="admin"?"Espace Administrateur":"Espace Secrétaire") + `<div class="wrap" style="padding:24px 16px;max-width:800px;">
      <button class="link-btn no-print" data-action="back-to-list">⬅️ Retour</button>
      <p class="muted" style="margin-top:14px;">Élève introuvable.</p>
    </div>`;
  }
  const periode = window.__bulPeriode || PERIODES[0];
  const annee = window.__bulAnnee || currentSchoolYear();
  const b = getBulletin(studentId, periode, annee);

  if(!b){
    return topBarHTML(role==="admin"?"Espace Administrateur":"Espace Secrétaire") + `<div class="wrap" style="padding:24px 16px;max-width:800px;">
      <button class="link-btn no-print" data-action="back-to-list">⬅️ Retour</button>
      <p class="muted" style="margin-top:14px;">Aucune donnée enregistrée pour ${esc(periode)} — ${esc(annee)}. Remplissez d'abord le formulaire de notes.</p>
    </div>`;
  }

  const moyenne = bulletinMoyenne(b);
  const nbMoyennes = b.disciplines.filter(d=>d.obtenu!=="" && !isNaN(parseFloat(d.obtenu))).length;
  const seuil = moyenne===null? "-" : (moyenne>=10? "Oui":"Non");
  const mates = classmateBulletins(student.classe, periode, annee);
  let rang = "-";
  if(moyenne!==null && mates.length>0){
    const sorted = [...mates].sort((a,c)=>c.moyenne-a.moyenne);
    const idx = sorted.findIndex(x=>x.b.id===b.id);
    rang = (idx>=0? (idx+1) : "-") + (mates.length>1? " / "+mates.length : "");
  }
  const plusFaible = mates.length>0? Math.min(...mates.map(x=>x.moyenne)).toFixed(2) : "-";
  const plusForte = mates.length>0? Math.max(...mates.map(x=>x.moyenne)).toFixed(2) : "-";
  const totalObtenu = b.disciplines.reduce((a,d)=>a+(parseFloat(d.obtenu)||0),0);

  const rows = b.disciplines.map((d,i)=>`<tr>

    <td style="text-align:center;">${esc(d.perf)}</td>
    <td>${esc(d.appreciation)}</td>

  return `<div class="wrap" style="padding:24px 16px;max-width:820px;">
    <div class="row between wrap-gap no-print" style="margin-bottom:16px;">
      <button class="link-btn" data-action="back-to-list">⬅️ Retour</button>

    <div class="card p8 print-area bulletin-sheet">
      <div class="wm-bg-tile" style="background-image:url('${db.meta.schoolLogo || APP_LOGO_SRC}')"></div>
      <div class="bul-head">
        <div class="bul-left">
          ${schoolLogoBadgeHTML("","bul-logo-fallback")}
          <div>
            <div class="name">${esc(db.meta.schoolName || "Nom de l'école")}</div>
            ${db.meta.schoolEmail? `<div class="contact">✉ ${esc(db.meta.schoolEmail)}</div>`:""}
            ${db.meta.schoolPhone? `<div class="contact">☎ ${esc(db.meta.schoolPhone)}</div>`:""}
          </div>
        </div>
        <div class="bul-center">
          <div class="country">${esc(db.meta.country)}</div>
          ${db.meta.ministryLine? `<div>${esc(db.meta.ministryLine)}</div><div>----------------------</div>`:""}
          ${db.meta.directionLine? `<div>${esc(db.meta.directionLine)}</div><div>----------------------</div>`:""}
          ${db.meta.circonscriptionLine? `<div>${esc(db.meta.circonscriptionLine)}</div>`:""}
        </div>
        <div class="bul-right">
          <img src="${BENIN_FLAG_SRC}" alt="Drapeau du Bénin" class="bul-flag-img">
          <div class="bul-right-info">
            <div>ANNÉE SCOLAIRE : ${esc(annee)}</div>
            <div>N° MATRICULE : ${esc(b.matricule)||"-"}</div>
            <div>ÉVALUATION : ${esc(b.evaluation)||"-"}</div>
          </div>
        </div>
      </div>

      <div class="bul-title-box">BULLETIN DE NOTES — ${esc(periode).toUpperCase()}</div>

      <div class="bul-info">
        <div class="bul-info-row"><span>Nom de l'élève : <b>${esc(student.nom)}</b></span><span>Classe : <b>${esc(student.classe)}</b></span></div>
        <div class="bul-info-row"><span>Prénoms : <b>${esc(student.prenom)}</b></span><span>Groupe : <b>${esc(b.groupe)||"-"}</b></span></div>
        <div class="bul-info-row"><span>Sexe : <b>${esc(b.sexe)||"-"}</b></span><span>Effectif : <b>${esc(b.effectif)||"-"}</b></span></div>
        <div class="bul-info-row"><span>Redoublant : <b>${esc(b.redoublant)||"Non"}</b></span><span></span></div>
      </div>

      <div class="bul-section-title">I — CONNAISSANCES ET HABILETÉS</div>
      <table class="bul-table" style="margin-bottom:14px;">
        <thead><tr><th style="text-align:left;">Disciplines</th><th>Obtenu</th><th>Perf</th><th>Appréciations de l'enseignant</th></tr></thead>
        <tbody>
          ${rows}
          <tr><td style="text-align:left;font-weight:800;">TOTAL</td><td style="text-align:center;font-weight:800;">${totalObtenu||""}</td><td style="text-align:center;font-weight:800;">${totalPerf||""}</td><td></td></tr>
        </tbody>
      </table>

      <div class="bul-section-title">II — RÉCAPITULATIF</div>

function dashboardHTML(){
  const f = computeFinancials();
  const classes = classBreakdown();
  const evo = monthlyEvolution(db.payments, db.revenues, db.expenses);
  const maxClass = Math.max(1, ...classes.map(c=>c.paye));
  const classBars = classes.map(c=>`<div class="bar-row">
    <div class="bar-label">${esc(c.classe)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round((c.paye/maxClass)*100)}%;"></div></div>
    <div class="bar-val">${formatFCFA(c.paye)}</div>
  </div>`).join("");

  const maxEvo = Math.max(1, ...evo.map(m=>Math.max(m.recettes,m.depenses)));
  const evoCols = evo.map(m=>`<div class="evo-col">
    <div class="evo-bars">
      <div class="evo-bar" style="height:${Math.round((m.recettes/maxEvo)*150)}px;background:var(--emerald-600);" title="Recettes: ${formatFCFA(m.recettes)}"></div>
      <div class="evo-bar" style="height:${Math.round((m.depenses/maxEvo)*150)}px;background:var(--red-600);" title="Dépenses: ${formatFCFA(m.depenses)}"></div>
    </div>
    <div class="evo-label">${m.label}</div>
  </div>`).join("");

  return `<div class="grid-gap">
    <div class="grid3">
      ${statCard("Chiffre d'affaires total", formatFCFA(f.totalRevenue), "📈", "blue")}
      ${statCard("Dépenses totales", formatFCFA(f.totalExpenses), "📉", "red")}
      ${statCard("Bénéfice net (après AIB)", formatFCFA(f.netProfit), "💵", "emerald")}
      ${statCard("Nombre d'élèves", db.students.length, "👥", "amber")}
    </div>
    <div class="grid2">
      ${statCard("Taux de recouvrement des frais de scolarité", f.recoveryRate.toFixed(1)+" %", "💰", "white")}
      ${statCard("AIB (4% du bénéfice)", formatFCFA(f.aib), "🏢", "white")}
    </div>
    <div class="card p5">
      <h3 class="title">Évolution mois par mois</h3>
      ${evo.length===0? `<p class="empty-row">Pas encore de données</p>` : `
        <div class="legend"><span><i class="dot" style="background:var(--emerald-600);"></i>Recettes</span><span><i class="dot" style="background:var(--red-600);"></i>Dépenses</span></div>
        <div class="evo-chart">${evoCols}</div>
      `}
    </div>
    <div class="card p5">
      <h3 class="title">Classes qui rapportent le plus</h3>
      ${classes.length===0? `<p class="empty-row">Pas encore de données</p>` : classBars}
    </div>
  </div>`;
}

function rentreeHTML(){
  const y = db.meta.anneeScolaireActuelle;
  const actifs = [...db.students].filter(s=>s.statut!=="inactif").sort((a,b)=>(a.classe||"").localeCompare(b.classe||"")||a.nom.localeCompare(b.nom));
  const inactifs = db.students.filter(s=>s.statut==="inactif");
  return `<div class="grid-gap">
    <div class="card p5">
      <h3 class="title">🎓 Année scolaire active : ${schoolYearLabel(y)}</h3>
      <p class="muted">Cette page sert à préparer la rentrée suivante : pour chaque élève qui continue, choisissez sa nouvelle classe et son frais annuel, puis validez. Les élèves non cochés seront marqués « non reconduits » (ils restent visibles dans l'historique, rien n'est supprimé). Le compteur « reste à payer » repart alors à zéro pour la nouvelle année — tout l'historique des paiements passés reste consultable dans les Archives.</p>
      <div class="row wrap-gap" style="gap:10px;margin:14px 0;align-items:center;">
        <span class="muted">Appliquer un frais annuel à tous les élèves cochés :</span>
        <input id="rentree-bulk-frais" type="number" placeholder="ex: 45000" style="border:1px solid var(--slate-300);border-radius:10px;padding:8px 10px;width:140px;">
        <button class="btn btn-ghost" data-action="apply-bulk-frais" type="button">Appliquer</button>
      </div>
    </div>

    <div class="card p5">
      <h3 class="title">Élèves actifs (${actifs.length})</h3>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Continue ?</th><th>Élève</th><th>Classe actuelle</th><th>Nouvelle classe</th><th>Nouveau frais annuel</th></tr></thead>
        <tbody>${actifs.map(s=>`<tr>
          <td><input type="checkbox" id="rentree-cont-${s.id}" checked></td>
          <td>${esc(s.nom)} ${esc(s.prenom)}</td>
          <td>${esc(s.classe)}</td>
          <td><input id="rentree-classe-${s.id}" value="${esc(s.classe)}" style="width:100px;"></td>
          <td><input id="rentree-frais-${s.id}" type="number" value="${s.fraisAnnuel||0}" style="width:110px;"></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <button class="btn btn-navy" style="margin-top:16px;" data-action="validate-rentree">Valider la rentrée → passer à l'année ${schoolYearLabel(y+1)}</button>
    </div>

    ${inactifs.length? `<div class="card p5">
      <h3 class="title">Élèves non reconduits (${inactifs.length})</h3>
      <p class="muted">Ils ne comptent plus parmi les effectifs actifs, mais restent consultables (historique, reçus, bulletins).</p>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Élève</th><th>Dernière classe</th><th></th></tr></thead>
        <tbody>${inactifs.map(s=>`<tr>
          <td>${esc(s.nom)} ${esc(s.prenom)}</td>
          <td>${esc(s.classe)}</td>
          <td><button class="btn btn-ghost" data-action="reactivate-student" data-id="${s.id}" type="button">Réactiver</button></td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>` : ""}
  </div>`;
}
function applyBulkFrais(){
  const frais = val("rentree-bulk-frais");
  if(!frais) return;
  document.querySelectorAll('[id^="rentree-cont-"]').forEach(chk=>{
    if(chk.checked){
      const id = chk.id.replace("rentree-cont-","");
      const input = document.getElementById("rentree-frais-"+id);
      if(input) input.value = frais;
    }
  });
}
function validateRentree(){
  const y = db.meta.anneeScolaireActuelle;
  if(!confirm(`Valider la rentrée et passer à l'année ${schoolYearLabel(y+1)} ? Les élèves non cochés seront marqués non reconduits. Cette action peut être répétée sans danger si besoin.`)) return;
  const actifs = [...db.students].filter(s=>s.statut!=="inactif");
  actifs.forEach(s=>{
    const contCheckbox = document.getElementById("rentree-cont-"+s.id);
    const continue_ = contCheckbox? contCheckbox.checked : true;
    if(continue_){
      const classe = val("rentree-classe-"+s.id) || s.classe;
      const frais = val("rentree-frais-"+s.id);
      db.students = db.students.map(st => st.id===s.id? {...st, classe, fraisAnnuel:Number(frais)||st.fraisAnnuel, statut:"actif"} : st);
    } else {
      db.students = db.students.map(st => st.id===s.id? {...st, statut:"inactif"} : st);
    }
  });
  db.meta.anneeScolaireActuelle = y + 1;
  saveDB(); showToast(`Rentrée validée — année ${schoolYearLabel(y+1)} démarrée`); render();
}
function reactivateStudent(id){
  db.students = db.students.map(s=> s.id===id? {...s, statut:"actif"} : s);
  saveDB(); showToast("Élève réactivé"); render();
}

/* ---- Archives annuelles ---- */
function activityYears(){
  const set = new Set();
  db.payments.forEach(p=>{ if(p.date) set.add(new Date(p.date).getFullYear()); });
  db.revenues.forEach(r=>{ if(r.date) set.add(new Date(r.date).getFullYear()); });
  db.expenses.forEach(e=>{ if(e.date) set.add(new Date(e.date).getFullYear()); });
  db.students.forEach(s=>{ if(s.dateInscription) set.add(new Date(s.dateInscription).getFullYear()); });
  return [...set].filter(y=>!isNaN(y)).sort((a,b)=>b-a);
}

}
function monthlyReportHTML(month){
  const payments = db.payments.filter(p=>monthKey(p.date)===month);
  const revenues = db.revenues.filter(r=>monthKey(r.date)===month);
  const expenses = db.expenses.filter(e=>monthKey(e.date)===month);
  const totalIn = payments.reduce((a,p)=>a+p.montant,0)+revenues.reduce((a,r)=>a+r.montant,0);
  const totalOut = expenses.reduce((a,e)=>a+e.montant,0);
  const profit = totalIn-totalOut;
  const aib = profit>0? profit*AIB_RATE : 0;
  return `${reportHeaderHTML("Rapport financier mensuel", monthLabel(month))}
    <div class="grid3" style="margin-bottom:22px;">
      ${statCard("Recettes", formatFCFA(totalIn), "📈", "emerald")}
      ${statCard("Dépenses", formatFCFA(totalOut), "📉", "red")}
      ${statCard("Bénéfice net", formatFCFA(profit-aib), "💵", "blue")}
    </div>
    <h4 style="color:var(--navy-950);">Paiements reçus des élèves</h4>
    ${reportTableHTML(["Élève","Catégorie","Montant","Date"], payments.map(p=>{const st=db.students.find(s=>s.id===p.studentId);return [esc((st?st.nom+" "+st.prenom:"-")), esc(p.categorie), formatFCFA(p.montant), formatDate(p.date)];}))}
    <h4 style="color:var(--navy-950);margin-top:22px;">Autres recettes</h4>
    ${reportTableHTML(["Description","Catégorie","Montant","Date"], revenues.map(r=>[esc(r.description),esc(r.categorie),formatFCFA(r.montant),formatDate(r.date)]))}
    <h4 style="color:var(--navy-950);margin-top:22px;">Dépenses</h4>
    ${reportTableHTML(["Description","Catégorie","Montant","Date"], expenses.map(e=>[esc(e.description),esc(e.categorie),formatFCFA(e.montant),formatDate(e.date)]))}
    <div class="muted" style="margin-top:20px;padding-top:14px;border-top:1px solid var(--slate-200);">AIB (4% du bénéfice du mois): <strong>${formatFCFA(aib)}</strong></div>`;
}
function annualReportHTML(year){
  const inYear = d => new Date(d).getFullYear()===Number(year);
  const payments = db.payments.filter(p=>inYear(p.date));
  const revenues = db.revenues.filter(r=>inYear(r.date));
  const expenses = db.expenses.filter(e=>inYear(e.date));
  const totalIn = payments.reduce((a,p)=>a+p.montant,0)+revenues.reduce((a,r)=>a+r.montant,0);
  const totalOut = expenses.reduce((a,e)=>a+e.montant,0);
  const profit = totalIn-totalOut;
  const aib = profit>0? profit*AIB_RATE : 0;
  const evo = monthlyEvolution(payments, revenues, expenses);
  return `${reportHeaderHTML("Rapport annuel", "Année "+year)}
    <div class="grid3" style="margin-bottom:22px;">
      ${statCard("Recettes totales", formatFCFA(totalIn), "📈", "emerald")}
      ${statCard("Dépenses totales", formatFCFA(totalOut), "📉", "red")}
      ${statCard("Bénéfice net (après AIB)", formatFCFA(profit-aib), "💵", "blue")}

    <h4 style="color:var(--navy-950);">Détail mensuel</h4>

}

function profitReportHTML(start, end){
  const payments = db.payments.filter(p=>inPeriod(p.date,start,end));
  const revenues = db.revenues.filter(r=>inPeriod(r.date,start,end));
  const expenses = db.expenses.filter(e=>inPeriod(e.date,start,end));
  const allPayments = payments.reduce((a,p)=>a+p.montant,0);
  const totalRevenuesOther = revenues.reduce((a,r)=>a+r.montant,0);
  const totalRevenue = allPayments+totalRevenuesOther;
  const totalExpenses = expenses.reduce((a,e)=>a+e.montant,0);
  const profitBeforeTax = totalRevenue-totalExpenses;
  const aib = profitBeforeTax>0? profitBeforeTax*AIB_RATE : 0;
  const netProfit = profitBeforeTax-aib;
  return `${reportHeaderHTML("Rapport de bénéfice", periodLabel(start,end,"Situation globale"))}
    ${reportTableHTML(["Élément","Montant"], [
      ["Recettes - Paiements élèves (toutes catégories)", formatFCFA(allPayments)],
      ["Recettes - Autres", formatFCFA(totalRevenuesOther)],
      ["Chiffre d'affaires total", formatFCFA(totalRevenue)],
      ["Dépenses totales", formatFCFA(totalExpenses)],
      ["Bénéfice avant impôt", formatFCFA(profitBeforeTax)],
      ["AIB (4% du bénéfice)", formatFCFA(aib)],
      ["Bénéfice net", formatFCFA(netProfit)],
    ])}
    <div class="notice" style="margin-top:20px;background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;">L'AIB (Acompte sur Impôt assis sur les Bénéfices) est calculé ici à 4% du bénéfice avant impôt, uniquement lorsque celui-ci est positif.</div>`;
}

function stripWhiteBackground(dataUrl, callback){
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    let imageData;
    try{ imageData = ctx.getImageData(0,0,canvas.width,canvas.height); }
    catch(e){ callback(dataUrl); return; }
    const d = imageData.data;
    const tLow = 222, tHigh = 250;
    for(let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2];
      const minc = Math.min(r,g,b);
      let ramp = (minc - tLow)/(tHigh - tLow);
      ramp = Math.max(0, Math.min(1, ramp));
      const alphaNorm = 1 - ramp;
      const alphaSafe = Math.max(alphaNorm, 0.001);
      d[i]   = Math.max(0, Math.min(255, (r - (1-alphaSafe)*255)/alphaSafe));
      d[i+1] = Math.max(0, Math.min(255, (g - (1-alphaSafe)*255)/alphaSafe));
      d[i+2] = Math.max(0, Math.min(255, (b - (1-alphaSafe)*255)/alphaSafe));
      d[i+3] = Math.round(alphaNorm*255);
    }
    ctx.putImageData(imageData,0,0);
    callback(canvas.toDataURL("image/png"));
  };
  img.onerror = function(){ callback(dataUrl); };
  img.src = dataUrl;
}

function uploadLogo(input){

  const reader = new FileReader();
  reader.onload = function(e){

      db.meta.schoolLogo = transparentDataUrl;
      saveDB(); showToast("Logo mis à jour (fond retiré)"); render();
    });
  };
  reader.readAsDataURL(file);
}

function onAppClick(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const key = btn.dataset.key;
  const role_ = btn.dataset.role;

  switch(action){
    case "activate-license": activateLicense(); break;
    case "copy-device-id": {
      const code = btn.dataset.code || "";
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(()=>{ btn.textContent = "✅ Copié !"; setTimeout(()=>{ btn.textContent = "📋 Copier ce code"; }, 1500); });
      }
      break;
    }
    case "select-role": {
      if(role_==="admin"){
        requestAdminAuth(()=>{ role="admin"; secTab="eleves"; adminTab="dashboard"; secScreen=null; reportActive=null; secDrawerOpen=false; render(); });
      } else {
        requestSecretaryAuth(()=>{ role="secretaire"; secTab="eleves"; adminTab="dashboard"; secScreen=null; reportActive=null; secDrawerOpen=false; render(); });
      }
      break;
    }
    case "exit-role": role=null; secScreen=null; reportActive=null; secDrawerOpen=false; render(); break;
    case "set-sec-tab": secTab=key; secScreen=null; secDrawerOpen=false; render(); break;
    case "set-admin-tab": adminTab=key; secScreen=null; reportActive=null; window.__archiveYear=null; secDrawerOpen=false; render(); break;
    case "toggle-sec-drawer": secDrawerOpen=!secDrawerOpen; render(); break;
    case "close-sec-drawer": secDrawerOpen=false; render(); break;

    case "add-student": addStudent(); break;
    case "open-student": secScreen={type:"studentDetail", id}; render(); break;
    case "apply-bulk-frais": applyBulkFrais(); break;
    case "validate-rentree": validateRentree(); break;
    case "reactivate-student": reactivateStudent(id); break;
    case "open-pdf-import": openPdfImport(); break;
    case "close-pdf-import": closePdfImport(); break;
    case "confirm-pdf-import": confirmPdfImport(); break;
    case "open-historique": secScreen={type:"historique", id}; render(); break;
    case "open-bulletin-tab-for": {
      window.__bulletinStudentId=id;
      if(role==="admin"){ secScreen={type:"bulletin", studentId:id}; }
      else { secScreen=null; secTab="bulletin"; }
      render();
      break;
    }
    case "back-to-list": secScreen=null; render(); break;
    case "open-receipt": secScreen={type:"receipt", paymentId:id}; render(); break;
    case "open-receipt-from-detail": secScreen={type:"receipt", paymentId:id}; render(); break;
    case "open-bulletin-from-detail": secScreen={type:"bulletin", studentId:id}; render(); break;
    case "open-salary-historique": secScreen={type:"salaryHistorique", id}; render(); break;
    case "open-salary-receipt": secScreen={type:"salaryReceipt", paymentId:id}; render(); break;
    case "add-payment": addPayment(); break;
    case "add-revenue": addMoney("revenues","revenue"); break;
    case "add-expense": addMoney("expenses","expense"); break;
    case "add-cash-manual": addCashManual(); break;
    case "add-teacher": addTeacher(); break;
    case "add-salary-payment": addSalaryPayment(); break;
    case "save-edit-teacher": saveEditTeacher(id); break;
    case "save-bulletin": saveBulletin(id); break;
    case "print": window.print(); break;

    case "request-edit-student": {
      const student = db.students.find(s=>s.id===id);
      requestAdminAuth(()=>{ modalState = {type:"editStudent", student:{...student}}; render(); });
      break;
    }
    case "request-delete-student": {
      requestAdminAuth(()=>{
        if(!confirm("Supprimer cet élève et tous ses paiements/bulletins associés ?")) return;
        db.students = db.students.filter(s=>s.id!==id);
        db.payments = db.payments.filter(p=>p.studentId!==id);
        db.bulletins = db.bulletins.filter(g=>g.studentId!==id);
        saveDB(); showToast("Élève supprimé");
      });
      break;
    }
    case "request-delete-payment": {
      requestAdminAuth(()=>{
        if(!confirm("Supprimer ce paiement ?")) return;
        db.payments = db.payments.filter(p=>p.id!==id); saveDB(); showToast("Paiement supprimé");
      });
      break;
    }
    case "request-delete-revenue": {
      requestAdminAuth(()=>{ db.revenues = db.revenues.filter(r=>r.id!==id); saveDB(); showToast("Recette supprimée"); });
      break;
    }
    case "request-delete-expense": {
      const exp = db.expenses.find(x=>x.id===id);
      if(exp && exp.source==="salary"){ showToast("Supprimez ce paiement depuis l'onglet Personnel","error"); break; }
      requestAdminAuth(()=>{ db.expenses = db.expenses.filter(x=>x.id!==id); saveDB(); showToast("Dépense supprimée"); });
      break;
    }
    case "request-delete-cash": {
      requestAdminAuth(()=>{ db.cashManual = db.cashManual.filter(m=>m.id!==id); saveDB(); showToast("Mouvement supprimé"); });
      break;
    }
    case "request-edit-teacher": {
      const teacher = db.teachers.find(t=>t.id===id);
      requestAdminAuth(()=>{ modalState = {type:"editTeacher", teacher:{...teacher}}; render(); });
      break;
    }
    case "request-delete-teacher": {
      requestAdminAuth(()=>{
        if(!confirm("Supprimer cet enseignant et tout son historique de paiement ?")) return;
        const relatedExpenseIds = db.salaryPayments.filter(p=>p.teacherId===id).map(p=>p.expenseRefId).filter(Boolean);
        db.teachers = db.teachers.filter(t=>t.id!==id);
        db.salaryPayments = db.salaryPayments.filter(p=>p.teacherId!==id);
        db.expenses = db.expenses.filter(e=>!relatedExpenseIds.includes(e.id));
        saveDB(); showToast("Enseignant supprimé");
      });
      break;
    }
    case "request-delete-salary-payment": {
      requestAdminAuth(()=>{
        if(!confirm("Supprimer ce paiement de salaire ?")) return;
        const p = db.salaryPayments.find(x=>x.id===id);
        db.salaryPayments = db.salaryPayments.filter(x=>x.id!==id);
        if(p && p.expenseRefId) db.expenses = db.expenses.filter(e=>e.id!==p.expenseRefId);
        saveDB(); showToast("Paiement de salaire supprimé");
      });
      break;
    }
    case "close-modal": modalState=null; render(); break;
    case "submit-pin": submitPin(); break;
    case "save-edit-student": saveEditStudent(id); break;

    case "open-report": reportActive=key; window.__reportMonth=null; window.__reportYear=null; window.__reportStart=""; window.__reportEnd=""; render(); break;
    case "close-report": reportActive=null; render(); break;
    case "open-archive-year": window.__archiveYear=Number(key); render(); break;
    case "open-archive-year-custom": {
      const y = Number(val("archive-year-input"));
      if(!y || y<1900 || y>3000){ showToast("Entrez une année valide","error"); break; }
      window.__archiveYear = y; render();
      break;
    }
    case "close-archive-year": window.__archiveYear=null; render(); break;
    case "reset-report-period": window.__reportStart=""; window.__reportEnd=""; render(); break;
    case "save-admin-code": saveAdminCode(); break;
    case "save-secretary-code": saveSecretaryCode(); break;
    case "save-school-info": saveSchoolInfo(); break;
  }
}

  const nom = val("license-nom-input");
  const code = val("license-input");
  if(!nom){ licenseState = {...licenseState, ok:false, reason:"Veuillez indiquer votre nom"}; render(); return; }
  if(!code){ licenseState = {...licenseState, ok:false, reason:"Collez une clé de licence"}; render(); return; }
  const resultat = await verifierAupresDuServeur(code.trim().toUpperCase(), licenseState.deviceId);
  if(!resultat.ok){
    licenseState = {...licenseState, ok:false, reason:"Impossible de joindre le serveur de licences. Vérifiez votre connexion internet."};
    render(); return;
  }
  if(!resultat.valid){
    licenseState = {...licenseState, ok:false, reason: MESSAGES_ERREUR_LICENCE[resultat.reason] || "Clé de licence invalide."};
    render(); return;
  }
  ecrireLicenceStockee({
    cle: code.trim().toUpperCase(),
    nom,
    expiration: resultat.expiration || null,
    derniere_verification: new Date().toISOString()
  });
  licenseState = {ok:true, deviceId:licenseState.deviceId, payload:{d:licenseState.deviceId, x:resultat.expiration || null, nom}};
  render();
}

/* ---- Import d'une liste d'élèves depuis un PDF ---- */
let __pdfjsLoadPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(__pdfjsLoadPromise) return __pdfjsLoadPromise;
  __pdfjsLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve();
    };
    s.onerror = ()=> reject(new Error("Impossible de charger l'outil de lecture PDF — une connexion internet est nécessaire la première fois que vous utilisez l'import PDF."));
    document.head.appendChild(s);
  });
  return __pdfjsLoadPromise;
}
function looksLikeNameLine(s){
  if(!s || s.trim().length<3) return false;
  if(/^\d+$/.test(s.trim())) return false;
  if(/^(liste|classe|effectif|année|annee|n°|numero|nom|prénom|prenom|sexe|page)\b/i.test(s.trim())) return false;
  return true;
}
function splitNomPrenom(s){
  const parts = s.trim().split(/\s+/);
  if(parts.length===1) return {nom:parts[0], prenom:""};
  let i=0;
  while(i<parts.length-1 && parts[i]===parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  if(i===0) i=1;
  return {nom: parts.slice(0,i).join(" "), prenom: parts.slice(i).join(" ")};
}
function parseNameLine(line){
  let s = line.replace(/^\d+[\.\)]?\s*/, "").trim();
  let sexe = "M";
  const m = s.match(/\s(M|F|Masculin|Féminin|Feminin)\.?$/i);
  if(m){ sexe = /^F/i.test(m[1]) ? "F" : "M"; s = s.slice(0, m.index).trim(); }
  const {nom, prenom} = splitNomPrenom(s);
  return {nom, prenom, sexe};
}
async function extractLinesFromPdf(file){
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const lines = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      (byY[y] = byY[y]||[]).push(it);
    });
    Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const text = byY[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
      if(text) lines.push(text);
    });
  }
  return lines;
}
function openPdfImport(){ pdfImportState = {step:"upload", error:null}; render(); }
function closePdfImport(){ pdfImportState = null; render(); }
async function handlePdfFileSelected(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  pdfImportState = {step:"parsing"}; render();
  try{
    const lines = await extractLinesFromPdf(file);
    const rows = lines.filter(looksLikeNameLine).map(l=>({id:uid(), ...parseNameLine(l), include:true}));
    if(!rows.length){
      pdfImportState = {step:"upload", error:"Aucun nom n'a pu être détecté dans ce PDF. Vous pouvez toujours inscrire les élèves un par un ci-dessus."};
    } else {
      pdfImportState = {step:"preview", rows, classe:"", frais:"", date:todayISO(), error:null};
    }
  }catch(e){
    pdfImportState = {step:"upload", error: e.message || "Erreur lors de la lecture du PDF."};
  }
  render();
}
function pdfImportPanelHTML(){
  const st = pdfImportState;
  if(st.step==="upload"){
    return `<div class="card p5">
      <div class="row between wrap-gap"><h3 class="title" style="margin:0;">📄 Importer une liste d'élèves (PDF)</h3><button class="link-btn" data-action="close-pdf-import" type="button">✖️ Fermer</button></div>
      <p class="muted" style="margin:10px 0 14px;">Sélectionnez un PDF contenant la liste des élèves (une ligne par élève). L'extraction est automatique mais imparfaite : vous pourrez corriger chaque ligne avant de valider l'import. Note : la première utilisation nécessite une connexion internet (pour charger l'outil de lecture PDF), l'app reste ensuite utilisable hors ligne.</p>
      ${st.error? `<p style="color:var(--red-600);font-weight:600;margin-bottom:10px;">${esc(st.error)}</p>`:""}
      <input type="file" accept="application/pdf" onchange="handlePdfFileSelected(this)">
    </div>`;
  }
  if(st.step==="parsing"){
    return `<div class="card p5"><h3 class="title">📄 Lecture du PDF en cours...</h3><p class="muted">Cela peut prendre quelques secondes selon la taille du fichier.</p></div>`;
  }
  if(st.step==="preview"){
    return `<div class="card p5">
      <div class="row between wrap-gap"><h3 class="title" style="margin:0;">📄 Vérifiez la liste avant import (${st.rows.length} lignes détectées)</h3><button class="link-btn" data-action="close-pdf-import" type="button">✖️ Annuler</button></div>
      <p class="muted" style="margin:10px 0 14px;">Corrigez les noms/prénoms si besoin, décochez les lignes qui ne sont pas des élèves (en-têtes, totaux...), puis choisissez la classe et le frais annuel à appliquer à tous.</p>
      <div class="grid3" style="margin-bottom:16px;">
        ${field("Classe à appliquer *", `<input id="pdf-import-classe" placeholder="ex: CM2">`)}
        ${field("Frais annuel (FCFA) *", `<input id="pdf-import-frais" type="number">`)}
        ${field("Date d'inscription", `<input id="pdf-import-date" type="date" value="${st.date}">`)}
      </div>
      <div style="overflow-x:auto;max-height:420px;overflow-y:auto;"><table>
        <thead><tr><th>Importer</th><th>Nom</th><th>Prénom</th><th>Sexe</th></tr></thead>
        <tbody>${st.rows.map(r=>`<tr>
          <td><input type="checkbox" id="pdf-row-inc-${r.id}" checked></td>
          <td><input id="pdf-row-nom-${r.id}" value="${esc(r.nom)}"></td>
          <td><input id="pdf-row-prenom-${r.id}" value="${esc(r.prenom)}"></td>
          <td><select id="pdf-row-sexe-${r.id}"><option value="M" ${r.sexe==="M"?"selected":""}>Garçon</option><option value="F" ${r.sexe==="F"?"selected":""}>Fille</option></select></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <button class="btn btn-navy" style="margin-top:16px;" data-action="confirm-pdf-import" type="button">Importer les élèves cochés</button>
    </div>`;
  }
  return "";
}
function confirmPdfImport(){
  const st = pdfImportState;
  const classe = val("pdf-import-classe"), frais = val("pdf-import-frais"), date = val("pdf-import-date");
  if(!classe || !frais){ showToast("Choisissez la classe et le frais annuel à appliquer","error"); return; }
  let count = 0;
  st.rows.forEach(r=>{
    const inc = document.getElementById("pdf-row-inc-"+r.id);
    if(!inc || !inc.checked) return;
    const nom = val("pdf-row-nom-"+r.id), prenom = val("pdf-row-prenom-"+r.id), sexe = val("pdf-row-sexe-"+r.id);
    if(!nom) return;
    db.students.push({id:uid(), statut:"actif", nom, prenom, sexe:sexe||"M", classe, telephoneParent:"", fraisAnnuel:Number(frais), dateInscription:date||todayISO()});
    count++;
  });
  saveDB();
  pdfImportState = null;
  showToast(`${count} élève(s) importé(s)`);
  render();
}
